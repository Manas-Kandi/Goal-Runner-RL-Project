[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-runner-rl"
version = "0.1.0"
description = "A 2D reinforcement learning navigation game built with Godot 4.x and StableBaselines3"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Manas Kandi", email = "manas.kandi@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "godot-rl==0.8.2",
    "stable-baselines3==2.2.1",
    "torch==2.1.0",
    "gymnasium==0.29.1",
    "tensorboard==2.15.1",
    "numpy==1.24.3",
    "onnx==1.15.0",
    "onnxruntime==1.16.3",
    "tqdm==4.66.1",
    "pyyaml==6.0.1",
    "click==8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.9.1",
    "flake8==6.1.0",
    "mypy==1.6.1",
    "pandas==2.0.3",
    "wandb==0.16.0",
]

[project.scripts]
goal-runner-train = "goal_runner.train:main"
goal-runner-eval = "goal_runner.evaluate:main"
goal-runner-export = "goal_runner.export:main"

[project.urls]
Homepage = "https://github.com/Manas-Kandi/Goal-Runner-RL-Project"
Repository = "https://github.com/Manas-Kandi/Goal-Runner-RL-Project.git"
Documentation = "https://github.com/Manas-Kandi/Goal-Runner-RL-Project/docs"
"Bug Tracker" = "https://github.com/Manas-Kandi/Goal-Runner-RL-Project/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["goal_runner*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
